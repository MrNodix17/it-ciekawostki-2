version: '3.9'
services:
  db:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postgres -d it_portal'
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 30s
      
  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    command: 'redis-server --appendonly yes'
    volumes:
      - 'redisdata:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
      
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7126
      # Te adresy zadziałają dzięki automatycznej sieci w Coolify
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/it_portal'
      REDIS_URL: 'redis://redis:6379'
      SESSION_SECRET: '${SESSION_SECRET:-dev-secret-CHANGE-IN-PRODUCTION-abc123xyz789}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`itciekawostki2.amniscode.dev`)"
      - "traefik.http.services.app.loadbalancer.server.port=7126"

volumes:
  pgdata: null
  redisdata: null

# USUNIĘTE: Sekcja definiująca sieci (networks) na samym dole pliku
